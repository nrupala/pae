[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pae-analytics"
version = "0.1.1"
description = "PAE Analytics Engine - Factor models, optimization, decision intelligence"
authors = [{ name = "Nrupal Akolkar", email = "nrupalakolkar@gmail.com" }]
license = { text = "AGPL-3.0" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "pyarrow>=15.0",
    "fastembed>=0.8",
    "sqlite-vec>=0.1.9",
    # AES-256-GCM chunk-text encryption for the PKE store
    # (pae.pke.store). Declared unconditionally rather than as an extra
    # because store.py imports it at module level; the env already carries
    # cryptography>=41 with wheels for all supported platforms.
    "cryptography>=41.0",
    "yfinance>=0.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "python-multipart>=0.0.18",
    "mcp>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    # numpy>=2.x stubs use PEP 695 `type` syntax (3.12+); mypy<2.4 aborts on
    # them when targeting our 3.11 floor. mypy>=2.4 parses third-party
    # stubs with the running interpreter, so the strict gate stays intact.
    "mypy>=2.4",
    "ruff>=0.3",
    "httpx>=0.28",
]

[project.scripts]
pae-server = "pae.server:app"
pae-mcp = "pae.mcp.__main__:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
strict = true
